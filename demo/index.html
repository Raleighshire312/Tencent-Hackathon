<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IntentLock — Proof-Carrying Payments</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; --bg:#07111f; --panel:#0e1d31; --line:#223953; --text:#eaf2ff; --muted:#94a8c2; --good:#57d6a0; --warn:#ffca73; --bad:#ff7d8d; --blue:#80b8ff; }
    * { box-sizing:border-box; } body { margin:0; background:radial-gradient(circle at top right,#16345a 0,#07111f 46%); color:var(--text); min-height:100vh; }
    main { max-width:1050px; margin:auto; padding:46px 22px; } .eyebrow { color:var(--blue); letter-spacing:.14em; text-transform:uppercase; font-size:12px; font-weight:700; }
    h1 { font-size:clamp(34px,6vw,64px); line-height:1; margin:14px 0; max-width:700px; } .lead { color:var(--muted); font-size:18px; max-width:720px; }
    .grid { display:grid; grid-template-columns:1.15fr .85fr; gap:18px; margin-top:30px; } .card { background:rgba(14,29,49,.88); border:1px solid var(--line); border-radius:18px; padding:22px; box-shadow:0 18px 50px #0003; }
    label { color:var(--muted); font-size:13px; display:block; margin-bottom:8px; } textarea { width:100%; min-height:120px; resize:vertical; border:1px solid var(--line); border-radius:12px; background:#091728; color:var(--text); padding:14px; font:inherit; }
    button { border:1px solid #41658d; border-radius:10px; color:var(--text); background:#173253; padding:10px 14px; cursor:pointer; margin:8px 6px 0 0; } button:hover { background:#21476f; }
    .result { margin-top:18px; border-left:4px solid var(--blue); padding:14px 16px; background:#091728; border-radius:8px; white-space:pre-wrap; min-height:100px; } .good { border-color:var(--good); } .bad { border-color:var(--bad); } .warn { border-color:var(--warn); }
    .audit { display:grid; gap:10px; margin-top:12px; } .event { border:1px solid var(--line); border-radius:10px; padding:12px; display:flex; justify-content:space-between; gap:12px; color:var(--muted); } .event b { color:var(--text); } .chip { color:var(--good); font-size:12px; }
    @media (max-width:760px) { .grid { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">DBS Banking Track · Tencent Cloud Hackathon 2026</div>
    <h1>IntentLock</h1>
    <p class="lead">Proof-carrying payments: the AI can propose a transaction, but only a deterministic approval gate can execute it.</p>
    <div class="grid">
      <section class="card">
        <label for="request">Natural-language request</label>
        <textarea id="request">Send Mum S$200 and pay electricity S$85, but leave at least S$500.</textarea>
        <div>
          <button data-scenario="valid">Run valid request</button>
          <button data-scenario="attack">Run prompt-injection attack</button>
          <button data-scenario="tamper">Run approval tamper test</button>
        </div>
        <div id="result" class="result">Waiting for a request.</div>
      </section>
      <aside class="card">
        <div class="eyebrow">Audit timeline</div>
        <div id="audit" class="audit"><div class="event"><b>Ready</b><span class="chip">NO ACTION</span></div></div>
      </aside>
    </div>
  </main>
  <script src="./demo.js"></script>
</body>
</html>
